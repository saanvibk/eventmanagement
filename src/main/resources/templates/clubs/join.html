<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Join Club – ClubLink</title>
    <link rel="stylesheet" th:href="@{/css/events.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><a th:href="@{/}">🔗 ClubLink</a></div>
    <div class="nav-links">
        <a th:href="@{/clubs}">Clubs</a>
        <a th:href="@{/members}">Members</a>
        <a th:href="@{/members/requests}">Requests</a>
        <a th:href="@{/clubs/join}" class="btn-nav">+ Join Club</a>
    </div>
</nav>

<main class="main-content">

    <div class="page-header">
        <div class="breadcrumb">
            <a th:href="@{/}">Home</a> › <a th:href="@{/clubs}">Clubs</a> › Join
        </div>
        <h1>Join a Club</h1>
        <p class="subtitle">Submit your membership request. An admin will review it shortly.</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="form-card">
        <!-- POST to /clubs/join matching ClubController's @RequestParam signature -->
        <form action="/clubs/join" method="post">

            <div class="form-group">
                <label for="clubId">Club ID</label>
                <input type="number" id="clubId" name="clubId"
                       class="form-control" placeholder="Enter the Club ID you want to join" required/>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       class="form-control" placeholder="Enter your full name" required/>
            </div>

            <div class="form-group">
                <label for="srn">SRN</label>
                <input type="text" id="srn" name="srn"
                       class="form-control" placeholder="e.g. PES1UG22CS001" required/>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       class="form-control" placeholder="you@pesu.edu" required/>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit Request</button>
                <a href="/clubs" class="btn btn-outline">Cancel</a>
            </div>

        </form>
    </div>

</main>

<footer class="footer">
    <p>ClubLink &copy; 2025 | UE23CS352B OOAD Mini Project | Mem3 – Membership Management</p>
</footer>
</body>
</html>
