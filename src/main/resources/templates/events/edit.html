<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Event – ClubLink</title>
    <link rel="stylesheet" th:href="@{/css/events.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><a th:href="@{/}">🔗 ClubLink</a></div>
    <div class="nav-links">
        <a th:href="@{/events}">Events</a>
        <a th:href="@{/events/search}">Search</a>
    </div>
</nav>

<main class="main-content">
    <div class="form-container">
        <div class="form-header">
            <h1>Edit Event</h1>
            <p>Update the details for <strong th:text="${event.title}">this event</strong></p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/events/{id}/edit(id=${event.id})}"
              th:object="${event}" method="post" class="event-form">

            <div class="form-group">
                <label>Event Title *</label>
                <input type="text" th:field="*{title}" required/>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" rows="4"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Event Date *</label>
                    <input type="date" th:field="*{eventDate}" required/>
                </div>
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" th:field="*{startTime}"/>
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" th:field="*{endTime}"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Venue *</label>
                    <input type="text" th:field="*{venue}" required/>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select th:field="*{category}">
                        <option value="">-- Select --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}" th:text="${cat}"
                                th:selected="${cat == event.category}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Max Participants</label>
                    <input type="number" th:field="*{maxParticipants}" min="1"/>
                </div>
                <div class="form-group">
                    <label>Registration Fee (₹)</label>
                    <input type="number" th:field="*{registrationFee}" step="0.01" min="0"/>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">💾 Save Changes</button>
                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <p>ClubLink &copy; 2025 | Event Management by Mem2</p>
</footer>
</body>
</html>
