<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit Profile – ClubLink</title>
    <link rel="stylesheet" th:href="@{/css/events.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><a th:href="@{/}">🔗 ClubLink</a></div>
    <div class="nav-links">
        <a th:href="@{/clubs}">Clubs</a>
        <a th:href="@{/members}">Members</a>
        <a th:href="@{/members/requests}">Requests</a>
        <a th:href="@{/clubs/join}" class="btn-nav">+ Join Club</a>
    </div>
</nav>

<main class="main-content">
    <div class="page-header">
        <div class="breadcrumb">
            <a th:href="@{/}">Home</a> › <a th:href="@{/members}">Members</a> › Edit Profile
        </div>
        <h1>Edit Profile</h1>
        <p class="subtitle">Update member details below</p>
    </div>

    <div class="form-card">
        <form th:action="@{/members/{id}/edit(id=${member.id})}" th:object="${member}" method="post">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required/>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required/>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="Optional"/>
            </div>

            <div class="form-group">
                <label>SRN</label>
                <input type="text" th:value="${member.srn}" class="form-control" disabled/>
            </div>

            <div class="form-group">
                <label>Status</label>
                <input type="text" th:value="${member.status}" class="form-control" disabled/>
                <small style="color:var(--muted)">Status is managed by the system.</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/members}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <p>ClubLink &copy; 2025 | UE23CS352B OOAD Mini Project | Mem3 – Membership Management</p>
</footer>
</body>
</html>
