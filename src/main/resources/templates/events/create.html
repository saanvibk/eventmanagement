<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Event – ClubLink</title>
    <link rel="stylesheet" th:href="@{/css/events.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><a th:href="@{/}">🔗 ClubLink</a></div>
    <div class="nav-links">
        <a th:href="@{/events}">Events</a>
        <a th:href="@{/events/search}">Search</a>
    </div>
</nav>

<main class="main-content">
    <div class="form-container">
        <div class="form-header">
            <h1>Create New Event</h1>
            <p>Fill in the details to create a new club event (saved as DRAFT)</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/events/new}" th:object="${event}" method="post" class="event-form">

            <div class="form-group">
                <label for="title">Event Title *</label>
                <input type="text" id="title" th:field="*{title}" required
                       placeholder="e.g. Annual Tech Fest 2025"/>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="4"
                          placeholder="Describe the event…"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="eventDate">Event Date *</label>
                    <input type="date" id="eventDate" th:field="*{eventDate}" required/>
                </div>
                <div class="form-group">
                    <label for="startTime">Start Time</label>
                    <input type="time" id="startTime" th:field="*{startTime}"/>
                </div>
                <div class="form-group">
                    <label for="endTime">End Time</label>
                    <input type="time" id="endTime" th:field="*{endTime}"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="venue">Venue *</label>
                    <input type="text" id="venue" th:field="*{venue}" required
                           placeholder="e.g. Auditorium Block A"/>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" th:field="*{category}">
                        <option value="">-- Select Category --</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="maxParticipants">Max Participants</label>
                    <input type="number" id="maxParticipants" th:field="*{maxParticipants}"
                           min="1" placeholder="Leave blank for unlimited"/>
                </div>
                <div class="form-group">
                    <label for="registrationFee">Registration Fee (₹)</label>
                    <input type="number" id="registrationFee" th:field="*{registrationFee}"
                           step="0.01" min="0" placeholder="0 for free"/>
                </div>
            </div>

            <!-- Hidden fields for club and organizer (in real app from session) -->
            <input type="hidden" th:field="*{clubId}" value="1"/>
            <input type="hidden" th:field="*{organizerId}" value="1"/>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">💾 Save as Draft</button>
                <a th:href="@{/events}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <p>ClubLink &copy; 2025 | Event Management by Mem2</p>
</footer>
</body>
</html>
