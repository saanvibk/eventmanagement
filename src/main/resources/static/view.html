<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 style="text-align:center;">All Clubs</h2>

<div style="text-align:center;">
    <button class = "load-btn" onclick="load()">Load</button>
</div>

<!-- FULL PAGE GRID -->
<div id="output" class="grid"></div>

<script>
function load() {
    fetch('/clubs')
        .then(res => res.json())
        .then(data => {

            const container = document.getElementById("output");
            container.innerHTML = ""; // clear old data

            data.forEach(club => {
                const div = document.createElement("div");
                div.className = "club-card";

                div.innerHTML = `
    <h3>${club.name}</h3>
    <p><b>ID:</b> ${club.id}</p>
    <p><b>Description:</b> ${club.description}</p>
    <p><b>Leader:</b> ${club.leader}</p>

    <button onclick="viewDetails(${club.id})">View Details</button>`;

                container.appendChild(div);
            });
        });
}


function viewDetails(id) {
    window.location.href = `clubDetails.html?clubId=${id}`;
}
</script>

</body>
</html>
