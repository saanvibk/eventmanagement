<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
<h2>Change Leader</h2>

<input id="clubId" placeholder="Club ID">
<input id="leader" placeholder="New Leader SRN">

<button onclick="changeLeader()">Change</button>

</div>

<script>
function changeLeader() {

    const clubId = document.getElementById("clubId").value;
    const newLeader = document.getElementById("leader").value;

    fetch(`/clubs/${clubId}/leader?newLeader=${newLeader}`, {
        method: 'PUT'
    })
    .then(res => res.json())
    .then(data => {
        alert("Leader Updated!");
        console.log(data);
    })
    .catch(err => {
        console.error(err);
        alert("Error updating leader");
    });
}
</script>

</body>
</html>
